name: e2e-installers

# End-to-End-Tests für die Install-Skripte. Zwei isolierte Container,
# einer pro Installer; jeder führt exakt den Einzeiler aus install/README.md
# aus und prüft die resultierenden Artefakte (Binary, User, Gruppe,
# Pfade, Rechte, Config-Inhalt).
#
on:
  push:
    branches: [main, ci/split-releases-coverage]
    tags: ["v*"]
  pull_request:
    branches: [main, ci/split-releases-coverage]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch mit den Installer-Skripten (Default: main)"
        required: false
        default: main
      version:
        description: "Zu testende Release-Version (Default: latest)"
        required: false
        default: ""

permissions:
  contents: read
  # GITHUB_TOKEN wird im pick-Schritt genutzt, um das anonyme Rate-Limit
  # auf api.github.com (60/h) zu umgehen – GHA-Runner-IPs sind geteilt.

# Container-Default-Shell ist /bin/sh (=dash auf debian-slim); bash-spezifische
# Syntax ([[ ]], Arrays) braucht explizites bash.
defaults:
  run:
    shell: bash

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cert-api:
    name: e2e install-cert-api
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim
      options: --privileged
    env:
      REPO: gualcoinus/cert-distributor
    steps:
      - name: Benötigte Tools installieren
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive \
            apt-get install -y -qq --no-install-recommends \
              bash curl jq tar openssl ca-certificates sudo passwd

      - name: Quellen ermitteln (Tag → main, Branch-Push/PR → eigener Branch, manuell → inputs)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENT="${{ github.event_name }}"
          case "$EVENT" in
            push)
              if [[ "${{ github.ref_type }}" == tag ]]; then
                REF="main"                       # gemergter Code steht auf main
                VERSION="${GITHUB_REF_NAME#refs/tags/}"
              else
                REF="${{ github.ref_name }}"     # Branch-Push: Installer-Skripte direkt vom Branch
                VERSION="latest"                 # Tarball vom aktuell veroeffentlichten Release
              fi
              ;;
            pull_request)
              REF="${{ github.head_ref }}"       # PR-Quelle: dort liegen die Skripte
              VERSION="latest"
              ;;
            workflow_dispatch)
              REF="${{ inputs.ref }}"
              VERSION="${{ inputs.version }}"
              [[ -z $VERSION ]] && VERSION="latest"
              ;;
            *)
              echo "Unbekannter Event-Typ: $EVENT" >&2; exit 1 ;;
          esac

          # "latest" zur echten Tag-Version auflösen – Installer akzeptieren
          # nur konkrete Tags (latest literal ergibt asset=cert-...-latest-...
          # und 404). Die GitHub-API gibt den passenden Tag als tag_name.
          # GITHUB_TOKEN nutzen, um das anonyme Rate-Limit (60/h pro IP) zu
          # umgehen – GHA-Runner-IPs sind geteilt.
          if [[ $VERSION == latest ]]; then
            actual=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                       "https://api.github.com/repos/${REPO}/releases/latest" \
                     | jq -r '.tag_name // empty')
            if [[ -z $actual || $actual == null ]]; then
              echo "FEHLER: kein Release auf ${REPO} veröffentlicht – zuerst taggen." >&2
              exit 1
            fi
            echo "  latest → $actual"
            VERSION="$actual"
          fi

          echo "ref=$REF"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT"    >> "$GITHUB_OUTPUT"

      - name: Dummy-Let's-Encrypt-Struktur anlegen
        run: |
          mkdir -p /etc/letsencrypt/live/example.com /etc/letsencrypt/archive/example.com
          : > /etc/letsencrypt/live/example.com/fullchain.pem
          : > /etc/letsencrypt/live/example.com/privkey.pem
          : > /etc/letsencrypt/archive/example.com/fullchain1.pem
          chmod 644 /etc/letsencrypt/live/example.com/fullchain.pem
          chmod 600 /etc/letsencrypt/live/example.com/privkey.pem

      - name: Auf Release warten (max. 3 min)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          if [[ $VERSION == latest ]]; then exit 0; fi
          for _ in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/tags/${VERSION}")
            [[ $code == 200 ]] && { echo "Release $VERSION sichtbar"; exit 0; }
            echo "  HTTP $code – warte 5s"
            sleep 5
          done
          echo "Release $VERSION wurde nicht veröffentlicht"
          exit 1

      - name: Installer ausführen (genau der README-Einzeiler)
        run: |
          # Kein --no-systemd / --no-nginx: der Installer soll Unit-File und
          # nginx-Snippet auch ohne laufendes systemctl ablegen, das testen
          # wir hier explizit mit.
          curl -fsSL "https://raw.githubusercontent.com/${REPO}/${REF}/install/install-cert-api.sh" \
            | sudo bash -s -- --version "$VERSION"
        env:
          REF: ${{ steps.pick.outputs.ref }}
          VERSION: ${{ steps.pick.outputs.version }}


      - name: "Asserts: Binary, User, Gruppe, Verzeichnisse"
        run: |
          set -eu
          # Binary
          test -x /usr/local/bin/cert-api
          # User & Gruppe
          getent passwd cert-api >/dev/null
          getent group  cert-api >/dev/null
          getent group  ssl-cert >/dev/null
          id -Gn cert-api | tr ' ' '\n' | grep -Fxq 'ssl-cert'
          # /etc/cert-api
          test -d /etc/cert-api
          [[ "$(stat -c '%a' /etc/cert-api)"            == "750" ]]
          [[ "$(stat -c '%U'  /etc/cert-api)"            == "root" ]]
          [[ "$(stat -c '%G'  /etc/cert-api)"            == "cert-api" ]]
          test -f /etc/cert-api/config.toml
          [[ "$(stat -c '%a' /etc/cert-api/config.toml)" == "600" ]]
          # systemd-Unit + Drop-in (auch ohne laufendes systemctl abgelegt)
          test -f /etc/systemd/system/cert-api.service
          [[ "$(stat -c '%a' /etc/systemd/system/cert-api.service)" == "644" ]]
          test -f /etc/systemd/system/cert-api.service.d/override.conf
          grep -q '^Environment=CERT_API_LIVE_BASE='     /etc/systemd/system/cert-api.service.d/override.conf
          grep -q '^Environment=CERT_API_ARCHIVE_BASE='  /etc/systemd/system/cert-api.service.d/override.conf
          # nginx-Snippet
          test -f /etc/cert-api/nginx/cert-api.conf
          # add-cert.sh
          test -x /usr/local/share/cert-api/add-cert.sh

      - name: "Asserts: Let's-Encrypt-Rechte"
        run: |
          set -eu
          # privkey.pem muss 640 und Gruppe ssl-cert haben
          for d in /etc/letsencrypt/live /etc/letsencrypt/archive; do
            while IFS= read -r -d '' f; do
              [[ "$(stat -c '%a' "$f")" == "640" ]] || { echo "bad mode on $f"; exit 1; }
              [[ "$(stat -c '%G' "$f")" == "ssl-cert" ]] || { echo "bad group on $f"; exit 1; }
            done < <(find "$d" -type f -name 'privkey*.pem' -print0)
          done
          # Die LE-Pfade selbst müssen der Gruppe ssl-cert gehören
          [[ "$(stat -c '%G' /etc/letsencrypt/live)"     == "ssl-cert" ]]
          [[ "$(stat -c '%G' /etc/letsencrypt/archive)"  == "ssl-cert" ]]

      - name: "Asserts: Inhalte (config, service-unit, nginx, binary)"
        run: |
          set -eu
          # config.toml hat eine sinnvolle Vorlage (Loopback-Listen)
          grep -q '^listen = "127.0.0.1:8443"' /etc/cert-api/config.toml
          # Service-Unit startet /usr/local/bin/cert-api mit der Config
          grep -q '^ExecStart=/usr/local/bin/cert-api '      /etc/systemd/system/cert-api.service
          grep -q '/etc/cert-api/config.toml'                /etc/systemd/system/cert-api.service
          grep -q '^User=cert-api'                           /etc/systemd/system/cert-api.service
          # Binary ist ein echtes ELF (kein Stub, keine 0-Byte-Datei):
          # Magic "\x7fELF" in den ersten 4 Bytes, ohne 'file' als extra dep.
          head -c4 /usr/local/bin/cert-api | grep -q $'\x7fELF'

      - name: "Asserts: Idempotenz (zweiter Lauf bricht nicht)"
        run: |
          set -eu
          # Vorher: Config-Inhalt merken
          cfg_before=$(cat /etc/cert-api/config.toml)
          # Installer erneut aufrufen – bestehende Config darf nicht ueberschrieben werden
          curl -fsSL "https://raw.githubusercontent.com/${REPO}/${REF}/install/install-cert-api.sh" \
            | sudo bash -s -- --version "$VERSION"
          cfg_after=$(cat /etc/cert-api/config.toml)
          [[ "$cfg_before" == "$cfg_after" ]] || { echo "FAIL: config.toml wurde ueberschrieben"; exit 1; }
          echo "OK  Idempotenz: config.toml unveraendert nach zweitem Lauf"
        env:
          REF: ${{ steps.pick.outputs.ref }}
          VERSION: ${{ steps.pick.outputs.version }}

  test-cert-sync:
    name: e2e install-cert-sync
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim
      options: --privileged
    env:
      REPO: gualcoinus/cert-distributor
    steps:
      - name: Benötigte Tools installieren
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive \
            apt-get install -y -qq --no-install-recommends \
              bash curl jq tar openssl ca-certificates sudo passwd

      - name: Quellen ermitteln
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENT="${{ github.event_name }}"
          case "$EVENT" in
            push)
              if [[ "${{ github.ref_type }}" == tag ]]; then
                REF="main"
                VERSION="${GITHUB_REF_NAME#refs/tags/}"
              else
                REF="${{ github.ref_name }}"
                VERSION="latest"
              fi
              ;;
            pull_request)
              REF="${{ github.head_ref }}"
              VERSION="latest"
              ;;
            workflow_dispatch)
              REF="${{ inputs.ref }}"
              VERSION="${{ inputs.version }}"
              [[ -z $VERSION ]] && VERSION="latest"
              ;;
            *)
              echo "Unbekannter Event-Typ: $EVENT" >&2; exit 1 ;;
          esac

          # "latest" → konkreten Tag auflösen (Installer verstehen kein "latest").
          # GITHUB_TOKEN nutzen, um das anonyme Rate-Limit (60/h) zu umgehen.
          if [[ $VERSION == latest ]]; then
            actual=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                       "https://api.github.com/repos/${REPO}/releases/latest" \
                     | jq -r '.tag_name // empty')
            if [[ -z $actual || $actual == null ]]; then
              echo "FEHLER: kein Release auf ${REPO} veröffentlicht – zuerst taggen." >&2
              exit 1
            fi
            echo "  latest → $actual"
            VERSION="$actual"
          fi

          echo "ref=$REF"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Auf Release warten (max. 3 min)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          if [[ $VERSION == latest ]]; then exit 0; fi
          for _ in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/tags/${VERSION}")
            [[ $code == 200 ]] && { echo "Release $VERSION sichtbar"; exit 0; }
            echo "  HTTP $code – warte 5s"
            sleep 5
          done
          echo "Release $VERSION wurde nicht veröffentlicht"; exit 1

      - name: Installer ausführen (genau der README-Einzeiler)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${REPO}/${REF}/install/install-cert-sync.sh" \
            | sudo bash -s -- \
                --version "$VERSION" \
                --api-url "https://certs.test.example" \
                --cert    "example.com:KEY1234:/etc/ssl/example.com:nginx -t"
        env:
          REF: ${{ steps.pick.outputs.ref }}
          VERSION: ${{ steps.pick.outputs.version }}


      - name: "Asserts: Binary, Verzeichnisse, Cronfile, Logfile"
        run: |
          set -eu
          test -x /usr/local/bin/cert-sync
          test -x /usr/local/bin/cert-sync.sh  # Bash-Client
          # Rust-Binary ist ein echtes ELF (kein Stub, keine 0-Byte-Datei)
          head -c4 /usr/local/bin/cert-sync | grep -q $'\x7fELF'
          # Bash-Client hat einen gueltigen Shebang
          head -c2 /usr/local/bin/cert-sync.sh | grep -q '#!'
          test -d /etc/cert-sync
          [[ "$(stat -c '%a' /etc/cert-sync)"                 == "700" ]]
          [[ "$(stat -c '%U' /etc/cert-sync)"                 == "root" ]]
          test -f /etc/cert-sync/cert-sync.toml
          [[ "$(stat -c '%a' /etc/cert-sync/cert-sync.toml)" == "600" ]]
          # Cronfile mit korrektem Inhalt (cron-Zeit + Binary-Pfad)
          test -f /etc/cron.d/cert-sync
          [[ "$(stat -c '%a' /etc/cron.d/cert-sync)" == "644" ]]
          grep -q '^17 3 \* \* \*'                    /etc/cron.d/cert-sync
          grep -q '/usr/local/bin/cert-sync'          /etc/cron.d/cert-sync
          grep -q '/etc/cert-sync/cert-sync.toml'     /etc/cron.d/cert-sync
          # Cron-Beispiele aus dem Release daneben abgelegt
          test -f /etc/cert-sync/cert-sync.cron.example
          test -f /etc/cert-sync/cert-sync.sh.cron.example
          # Logfile existiert (vom Installer touch'ed, schreibbar fuer root)
          test -f /var/log/cert-sync.log

      - name: "Asserts: cert-sync.toml-Inhalt"
        run: |
          set -eu
          F=/etc/cert-sync/cert-sync.toml
          grep -Fxq 'api_url    = "https://certs.test.example"' "$F"
          grep -Fxq 'name       = "example.com"'                "$F"
          grep -Fxq 'api_key    = "KEY1234"'                    "$F"
          grep -Fxq 'target_dir = "/etc/ssl/example.com"'       "$F"
          grep -Fxq 'reload_cmd = "nginx -t"'                   "$F"
          # Default-reload_cmd auf Top-Level (Fallback, falls keine cert-spezifische)
          grep -q '^reload_cmd = "nginx -t && systemctl reload nginx"' "$F"

      - name: "Asserts: Idempotenz (zweiter Lauf ueberschreibt cert-sync.toml nicht)"
        run: |
          set -eu
          before=$(sha256sum /etc/cert-sync/cert-sync.toml | awk '{print $1}')
          curl -fsSL "https://raw.githubusercontent.com/${REPO}/${REF}/install/install-cert-sync.sh" \
            | sudo bash -s -- --version "$VERSION" \
                --api-url "https://certs.test.example" \
                --cert    "example.com:KEY1234:/etc/ssl/example.com:nginx -t"
          after=$(sha256sum /etc/cert-sync/cert-sync.toml | awk '{print $1}')
          [[ "$before" == "$after" ]] || { echo "FAIL: cert-sync.toml wurde ueberschrieben"; exit 1; }
          echo "OK  Idempotenz: cert-sync.toml unveraendert nach zweitem Lauf"
        env:
          REF: ${{ steps.pick.outputs.ref }}
          VERSION: ${{ steps.pick.outputs.version }}

      - name: Cleanup (Cron-Eintrag wieder entfernen)
        if: always()
        run: |
          sudo rm -f /etc/cron.d/cert-sync || true
